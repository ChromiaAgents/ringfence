<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner dashboard</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<h1 id="biz">Owner dashboard</h1>
<p class="mute">Every call, quote and payment. Rules come from owner.yaml and are enforced in code, not by the model.</p>
<div class="grid two" style="margin-top:20px">
  <section class="card"><h2>Rules</h2><table id="rules"></table></section>
  <section class="card"><h2>Private inference</h2><div id="att"></div></section>
</div>
<section class="card" style="margin-top:16px"><h2>Jobs and deposits</h2><table id="jobs"></table></section>
<section class="card" style="margin-top:16px"><h2>Ledger</h2><table id="ledger"></table></section>
<section class="card" style="margin-top:16px"><h2>Calls</h2><div id="calls"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const t = (ms) => new Date(ms).toLocaleTimeString();
const badge = (p) => !p ? '' : p.status === 'verified' ? `<span class="tag" title="signed by ${esc(p.signer)} (${esc(p.kind)})">TEE-signed ✓</span>` : p.status === 'pending' ? '<span class="tag">checking…</span>' : '<span class="tag warn">unverified</span>';
async function load() {
  const r = await fetch('/api/state'); if (!r.ok) return; const s = await r.json(); const o = s.owner;
  $('biz').textContent = o.business.name;
  const ru = o.rules;
  $('rules').innerHTML = [['Max discount', ru.max_discount_pct + '%'], ['Deposit', `${ru.deposit_pct}% (min $${ru.min_deposit_usd}, max $${ru.max_deposit_usd})`], ['Kill switch', ru.kill_switch ? '<span class="tag warn">ON: messages only</span>' : 'off'], ['Payout', `${o.payout.asset_symbol} → <span class="mono">${esc(o.payout.recipient || 'not set')}</span>`]]
    .map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('');
  const a = s.attestation;
  $('att').innerHTML = a.error ? `<p class="tag warn">${esc(a.error)}</p>` : `<p>Model <b>${esc(a.model)}</b> runs in an Intel TDX + NVIDIA TEE on NEAR AI Cloud.</p>
    <p>Attested signing key <span class="mono">${esc(a.signingAddress)}</span> ${a.quoteBindsKey ? '<span class="tag">bound in TDX quote ✓</span>' : '<span class="tag warn">not bound</span>'}</p>
    <p class="mute">Each agent reply is checked against this key. Full quote check: <a href="https://docs.near.ai/cloud/verification/verification-center">NEAR Verification Center</a>.</p>`;
  $('jobs').innerHTML = '<tr><th>Booked</th><th>Customer</th><th>Job</th><th>Quote</th><th>Deposit</th><th>Payment</th></tr>' + s.jobs.map((j) =>
    `<tr><td>${t(j.createdAt)}</td><td>${esc(j.caller.name)}<br><span class="mute">${esc(j.caller.postcode)}</span></td><td>${esc(j.serviceName)}<br><span class="mute">${esc(j.notes)}</span></td><td>$${j.quotedUsd}${j.discountPct ? ` (−${j.discountPct}%)` : ''}</td><td>$${j.depositUsd}</td><td>${j.payment ? `<span class="tag${j.payment.status === 'SUCCESS' ? '' : ' warn'}">${esc(j.payment.status)}</span><br><span class="mute">${esc(j.payment.originSymbol)} on ${esc(j.payment.chain)}</span>` : '<a href="/pay/' + j.id + '">link sent</a>'}</td></tr>`).join('');
  $('ledger').innerHTML = s.ledger.map((l) => `<tr><td>${t(l.at)}</td><td><span class="tag${l.kind === 'refused' ? ' warn' : ''}">${l.kind}</span></td><td>${esc(l.detail)}</td></tr>`).join('');
  $('calls').innerHTML = s.calls.map((c) => `<details ${c.endedAt ? '' : 'open'}><summary>${t(c.startedAt)} · ${c.channel}${c.from ? ' · ' + esc(c.from) : ''} · ${c.turns.length} turns ${c.endedAt ? '' : '<span class="tag">live</span>'}</summary><div class="log" style="margin:10px 0 18px">` +
    c.turns.map((x) => `<div class="bubble ${x.who}">${esc(x.text)} ${badge(x.proof)}</div>`).join('') + '</div></details>').join('');
}
load(); setInterval(load, 3000);
</script>
</body></html>
