[package]
name = "phone-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.93.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30"
hex = { version = "0.4", optional = true }

[features]
default = []
# NEAR Chain Signatures (EVM sends). Off by default: build with `--features evm` to include it.
evm = ["dep:hex"]

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
